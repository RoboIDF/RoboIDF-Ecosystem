name: Software demos and tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  m0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.76.0
          locked: true
      - run: pixi run --locked test
      - run: pixi run --locked demo-all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: software-reports
          path: artifacts/**/*.json
