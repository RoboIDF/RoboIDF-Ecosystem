[workspace]
name = "roboidf-ecosystem"
version = "0.1.0"
description = "Community adapters, datasets and validated robot models"
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.76.0"

[dependencies]
python = "3.12.*"

[tasks]
info = "python -c \"from pathlib import Path; print(Path('README.md').read_text())\""
website = "python -m http.server 8765 --bind 127.0.0.1 --directory website/dist"

[pypi-dependencies]
roboidf = { git = "https://github.com/RoboIDF/RoboIDF.git", rev = "d5b00b2c838deee505e69501e080fd23e711eb09" }

[tasks.demo]
cmd = "python adapter.py"
[tasks.test]
cmd = "python -m unittest discover -s tests -v"

[tasks.registry-demo]
cmd = "python registry.py"
[tasks.demo-all]
depends-on = ["demo", "registry-demo"]
