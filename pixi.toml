[workspace]
name = "roboidf-ecosystem"
version = "0.1.0"
description = "Community adapters, datasets and validated robot models"
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.76.0"

[dependencies]
python = "3.12.*"

[tasks]
info = "python -c \"from pathlib import Path; print(Path('README.md').read_text())\""
website = "python -m http.server 8765 --bind 127.0.0.1 --directory website/dist"
